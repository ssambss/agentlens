[project]
name = "agentlens"
dynamic = ["version"]  # from how many commits it has: hatch_build.py, agentlens/version.py
description = "Every Claude Code session you have open on this computer, on one screen in your terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "markdown-it-py[linkify]>=3",  # web addresses in Claude's replies become links
    "pyyaml>=6",
    "textual>=1.0",
    "claude-agent-sdk>=0.2",
    "pillow>=10",
]

[project.scripts]
agentlens = "agentlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlens"]

# hatch_build.py: the version, for the package and for agentlens --version and the app's title bar.
[tool.hatch.metadata.hooks.custom]
[tool.hatch.build.hooks.custom]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
