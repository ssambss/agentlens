[project]
name = "agentlens"
version = "0.1.0"
description = "See how you work with Claude Code agents, and get personalized advice on doing it better"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "markdown-it-py[linkify]>=3",  # web addresses in Claude's replies become links
    "pyyaml>=6",
    "textual>=1.0",
    "claude-agent-sdk>=0.2",
    "pillow>=10",
]

[project.scripts]
agentlens = "agentlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlens"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
