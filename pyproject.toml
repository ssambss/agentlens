[project]
name = "panopsis"
version = "0.1.0"
description = "Every Claude Code session you have open, on one screen in your terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "markdown-it-py[linkify]>=3",  # web addresses in Claude's replies become links
    "pyyaml>=6",
    "textual>=1.0",
    "claude-agent-sdk>=0.2",
    "pillow>=10",
]

[project.scripts]
panopsis = "panopsis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panopsis"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
